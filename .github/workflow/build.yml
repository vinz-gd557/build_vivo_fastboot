name: Build fastboot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev libselinux1-dev

      - name: Patch toolchain path
        run: |
          sed -i 's#/opt/poky/1.5/sysroots/x86_64-pokysdk-linux/usr/bin/x86_64-poky-linux/x86_64-poky-linux-gcc#gcc#' makefile

      - name: Build
        run: make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-binary
          path: fastboot
